# SonarQube project config (spec 006 / T001). Coverage from pytest (coverage.xml);
# the quality gate stays visibly skipped until the self-hosted server exists.
sonar.projectKey=MicroTodoSuite_log-message-processor
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test_*.py
sonar.exclusions=**/test_*.py
sonar.python.coverage.reportPaths=coverage.xml
# main.py is the subscribe-loop bootstrap; excluded from the coverage denominator.
sonar.coverage.exclusions=main.py
